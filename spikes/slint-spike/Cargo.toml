# PROTOTYPE: throwaway Slint validation spike for "Does Slint meet Genea's budgets?"
# (prudentmildew/genea#15). Lives only on the prototype/slint-spike branch; never merge.
[package]
name = "slint-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-skia", "unstable-winit-030", "unstable-wgpu-30"] }
ropey = "1.6"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
serde_json = "1"
libc = "0.2"
streaming-iterator = "0.1"
cocoa = "=0.26.0"
objc = "0.2"
# PROTOTYPE (#18): the same versions Slint uses, for the floor binary.
winit = "=0.30.13"
wgpu = { version = "=30.0.1", default-features = false, features = ["metal"] }
pollster = "0.4"

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1

[build-dependencies]
slint-build = "=1.18.1"

# PROTOTYPE (#18): env-gated experiments inside Slint, see patches/README.md.
[patch.crates-io]
i-slint-common = { path = "patches/i-slint-common" }
i-slint-renderer-skia = { path = "patches/i-slint-renderer-skia" }
wgpu-hal = { path = "patches/wgpu-hal" }
