# PROTOTYPE: throwaway GPUI validation spike for "Does GPUI meet Genea's budgets?"
# (prudentmildew/genea#14). Lives only on the prototype/gpui-spike branch; never merge.
[package]
name = "gpui-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
# Pinned to a Zed stable release tag, per ADR 0003. `profiler` exposes GPUI's
# foreground journal, which the spike reads for frame, input and stall timings.
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2", default-features = false, features = ["font-kit", "profiler"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2", features = ["font-kit"] }
ropey = "1.6"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
serde_json = "1"
libc = "0.2"
streaming-iterator = "0.1"
cocoa = "=0.26.0"
objc = "0.2"

# GPUI's own crates.io patches at the pinned tag (only those in GPUI's tree).
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1
