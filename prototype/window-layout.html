<!doctype html>
<!--
  PROTOTYPE: throwaway. Lives only on the prototype/window-layout branch.
  Question: "How should Genea's main window be laid out?" (wayfinder ticket #7)
  Plan: four structurally different window layouts, switchable via ?variant=A|B|C|D
  and the floating bar at the bottom (← / → keys also cycle, T toggles theme).
  Static mock content: a full-stack workspace (apps/web, apps/api, packages/shared).
  Keybinding hints follow WebStorm's macOS keymap.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genea Window Prototype</title>
<style>
:root {
  --bg: #ffffff; --panel: #f7f8fa; --chrome: #f2f3f5; --border: #e3e4e8; --fg: #1e1f22; --muted: #6c707e;
  --accent: #3574f0; --sel: #d4e2ff; --hover: #eceef2;
  --kw: #0033b3; --str: #067d17; --num: #1750eb; --com: #8c8c8c; --fn: #00627a; --ty: #871094;
  --add: #5fb865; --mod: #3574f0; --del: #e55765; --err: #e55765; --warn: #c9952b; --ok: #3f9b45;
  --addbg: #e6f6e6; --delbg: #fde8ea;
}
:root[data-theme="dark"] {
  --bg: #1e1f22; --panel: #2b2d30; --chrome: #27292c; --border: #393b40; --fg: #dfe1e5; --muted: #868a91;
  --accent: #3574f0; --sel: #2e436e; --hover: #34363b;
  --kw: #cf8e6d; --str: #6aab73; --num: #2aacb8; --com: #7a7e85; --fn: #56a8f5; --ty: #c77dbb;
  --add: #5fb865; --mod: #548af7; --del: #f75464; --err: #f75464; --warn: #f2c55c; --ok: #5fb865;
  --addbg: #25392a; --delbg: #402929;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
  font: 12.5px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
.mono { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 12.5px; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
.muted { color: var(--muted); }
.kbd { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; margin-left: 4px; white-space: nowrap; }
.grow { flex: 1; min-width: 0; min-height: 0; }
.row { display: flex; align-items: center; gap: 8px; }
.col { display: flex; flex-direction: column; }
.scroll { overflow: auto; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--muted); flex: none; }
.dot.on { background: var(--ok); }
.link { color: var(--accent); text-decoration: underline; cursor: pointer; }

/* window chrome */
.titlebar { height: 38px; flex: none; background: var(--chrome); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 12px 0 78px; gap: 12px; position: relative; }
.traffic { position: absolute; left: 14px; top: 13px; display: flex; gap: 8px; }
.traffic i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
.traffic i:nth-child(2) { background: #febc2e; } .traffic i:nth-child(3) { background: #28c840; }
.pill { border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.pill:hover { background: var(--hover); }
.statusbar { height: 24px; flex: none; background: var(--chrome); border-top: 1px solid var(--border); display: flex; align-items: center; gap: 14px; padding: 0 10px; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.statusbar .err { color: var(--err); } .statusbar .warn { color: var(--warn); }

/* panels */
.panel { background: var(--panel); }
.panel-h { height: 30px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px; font-weight: 600; font-size: 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.bl { border-left: 1px solid var(--border); } .br { border-right: 1px solid var(--border); } .bt { border-top: 1px solid var(--border); } .bb { border-bottom: 1px solid var(--border); }

/* tree */
.tree { padding: 4px 0; white-space: nowrap; }
.tn { display: flex; align-items: center; gap: 5px; height: 22px; padding-right: 8px; cursor: default; }
.tn:hover { background: var(--hover); }
.tn.active { background: var(--sel); }
.tn .chev { width: 10px; color: var(--muted); font-size: 9px; text-align: center; }
.tn .ico { width: 14px; text-align: center; font-size: 11px; }
.tn.st-M .nm { color: var(--mod); } .tn.st-A .nm { color: var(--add); } .tn.st-E .nm { color: var(--err); text-decoration: underline wavy var(--err); text-underline-offset: 3px; }
.tn .badge { margin-left: auto; font-size: 10.5px; color: var(--muted); }

/* tabs */
.tabs { height: 34px; flex: none; display: flex; align-items: stretch; background: var(--chrome); border-bottom: 1px solid var(--border); overflow: hidden; }
.tab { display: flex; align-items: center; gap: 6px; padding: 0 12px; border-right: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
.tab.active { color: var(--fg); background: var(--bg); box-shadow: inset 0 -2px var(--accent); }
.tab .x { opacity: .5; font-size: 10px; }
.crumbs { height: 26px; flex: none; display: flex; align-items: center; padding: 0 12px; gap: 6px; color: var(--muted); font-size: 11.5px; border-bottom: 1px solid var(--border); background: var(--bg); white-space: nowrap; overflow: hidden; }

/* editor */
.editor { background: var(--bg); overflow: auto; padding: 6px 0 40px; }
.ln { display: flex; height: 19px; line-height: 19px; white-space: pre; }
.ln .num { width: 44px; flex: none; text-align: right; padding-right: 8px; color: var(--muted); opacity: .7; user-select: none; }
.ln .g { width: 4px; flex: none; margin-right: 10px; }
.ln .g.A { background: var(--add); } .ln .g.M { background: var(--mod); } .ln .g.D { border-left: 4px solid transparent; position: relative; }
.ln .g.D::after { content: ""; position: absolute; left: -4px; top: 15px; border: 4px solid transparent; border-left-color: var(--del); }
.ln.cur { background: var(--hover); }
.ln.addl { background: var(--addbg); } .ln.dell { background: var(--delbg); } .ln.dell .code { text-decoration: line-through; opacity: .75; }
.k { color: var(--kw); } .s { color: var(--str); } .n { color: var(--num); } .c { color: var(--com); font-style: italic; } .f { color: var(--fn); } .t { color: var(--ty); }
.squig-e { text-decoration: underline wavy var(--err); text-underline-offset: 3px; }
.squig-w { text-decoration: underline wavy var(--warn); text-underline-offset: 3px; }
.caret { display: inline-block; width: 2px; height: 15px; background: var(--accent); vertical-align: -3px; margin-left: -1px; }
.hoverbox { position: absolute; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; box-shadow: 0 6px 20px rgba(0,0,0,.18); max-width: 420px; font-size: 12px; }

/* terminal & lists */
.term { background: var(--bg); padding: 8px 12px; white-space: pre; overflow: auto; line-height: 1.5; }
.term .p { color: var(--ok); } .term .w { color: var(--fn); } .term .a { color: var(--ty); }
.list .it { display: flex; align-items: center; gap: 8px; padding: 3px 10px; white-space: nowrap; }
.list .it:hover { background: var(--hover); }
.sev-e { color: var(--err); } .sev-w { color: var(--warn); }
.btn { border: 1px solid var(--border); border-radius: 5px; padding: 2px 8px; background: var(--bg); white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.stripe { width: 40px; flex: none; background: var(--chrome); display: flex; flex-direction: column; align-items: center; padding: 6px 0; gap: 4px; }
.stripe button { width: 30px; height: 30px; border-radius: 6px; font-size: 14px; color: var(--muted); }
.stripe button.on { background: var(--sel); color: var(--fg); }
.btabs { display: flex; gap: 2px; height: 30px; align-items: center; padding: 0 6px; border-bottom: 1px solid var(--border); background: var(--panel); flex: none; }
.btabs button { padding: 3px 10px; border-radius: 5px; color: var(--muted); white-space: nowrap; }
.btabs button.on { background: var(--sel); color: var(--fg); }

/* overlays */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.18); z-index: 20; }
.modal { position: fixed; left: 50%; top: 90px; transform: translateX(-50%); width: min(640px, 92vw); background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 18px 60px rgba(0,0,0,.35); z-index: 21; overflow: hidden; }
.modal input { width: 100%; border: 0; border-bottom: 1px solid var(--border); background: var(--bg); color: var(--fg); padding: 12px 14px; font: inherit; font-size: 14px; outline: none; }
.modal .it.sel { background: var(--sel); }
.drawer-l { position: fixed; left: 0; top: 38px; bottom: 24px; width: 300px; z-index: 21; border-right: 1px solid var(--border); box-shadow: 8px 0 30px rgba(0,0,0,.2); }
.drawer-b { position: fixed; left: 0; right: 0; bottom: 24px; height: 42%; z-index: 21; border-top: 1px solid var(--border); box-shadow: 0 -8px 30px rgba(0,0,0,.2); display: flex; flex-direction: column; }

/* variant C */
.pkg { border-bottom: 1px solid var(--border); padding: 8px 10px; }
.pkg.sel { background: var(--bg); box-shadow: inset 3px 0 var(--accent); }
.pkg .sc { display: flex; align-items: center; gap: 6px; padding: 2px 0 2px 14px; font-size: 12px; }
.pkg .sc .run { width: 18px; text-align: center; color: var(--ok); }
.pkg .sc .run.stop { color: var(--err); }
.logbox { display: flex; flex-direction: column; min-height: 0; flex: 1; border-bottom: 1px solid var(--border); }

/* variant D */
.banner { flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: var(--addbg); border-bottom: 1px solid var(--border); font-size: 12px; }

/* switcher */
#switcher { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 4px;
  background: #111; color: #fff; border-radius: 999px; padding: 5px 6px; box-shadow: 0 8px 24px rgba(0,0,0,.4); font-size: 12.5px; border: 1px solid #444; }
#switcher button { color: #fff; width: 28px; height: 28px; border-radius: 50%; font-size: 14px; }
#switcher button:hover { background: #333; }
#switcher .lbl { padding: 0 10px; min-width: 260px; text-align: center; white-space: nowrap; }
#switcher .sep { width: 1px; height: 18px; background: #444; margin: 0 4px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<div id="switcher"></div>
<script>
// ---------- mock data ----------
const FILES = {
  "apps/api/src/routes/users.ts": {
    git: { 4: "M", 9: "A", 10: "A", 11: "A", 12: "A" },
    deleted: { 4: 'export async function listUsers(): Promise<User[]> {' },
    diag: { line: 14, word: "UserRow", sev: "e" },
    cursor: 14,
    text: `import type { User } from "@demo/shared";
import { db } from "../db";

export async function listUsers(limit = 50): Promise<User[]> {
  const rows = await db.query("select * from users limit $1", [limit]);
  return rows.map(toUser);
}

export async function getUser(id: string): Promise<User | undefined> {
  const [row] = await db.query("select * from users where id = $1", [id]);
  return row ? toUser(row) : undefined;
}

function toUser(row: UserRow): User {
  return {
    id: row.id,
    name: row.display_name,
    email: row.email,
    createdAt: new Date(row.created_at),
  };
}`},
  "apps/web/src/components/UserList.tsx": {
    git: {}, deleted: {},
    diag: { line: 15, word: "index", sev: "w" },
    cursor: 8,
    text: `import { useEffect, useState } from "react";
import type { User } from "@demo/shared";

export function UserList() {
  const [users, setUsers] = useState<User[]>([]);

  useEffect(() => {
    fetch("/api/users")
      .then((res) => res.json())
      .then(setUsers);
  }, []);

  return (
    <ul className="users">
      {users.map((user, index) => (
        <li key={user.id}>{user.name}</li>
      ))}
    </ul>
  );
}`},
};

const TREE = [
  { n: "apps", d: 1, open: 1, c: [
    { n: "api", d: 1, open: 1, c: [
      { n: "src", d: 1, open: 1, c: [
        { n: "routes", d: 1, open: 1, c: [ { n: "users.ts", p: "apps/api/src/routes/users.ts", st: "E" }, { n: "health.ts" } ] },
        { n: "db.ts", st: "A" }, { n: "index.ts" } ] },
      { n: "package.json" }, { n: "tsconfig.json" } ] },
    { n: "web", d: 1, open: 1, c: [
      { n: "src", d: 1, open: 1, c: [
        { n: "components", d: 1, open: 1, c: [ { n: "UserList.tsx", p: "apps/web/src/components/UserList.tsx", st: "M" } ] },
        { n: "App.tsx" }, { n: "main.tsx" }, { n: "styles.css" } ] },
      { n: "index.html" }, { n: "package.json" }, { n: "tsconfig.json" } ] } ] },
  { n: "packages", d: 1, open: 1, c: [
    { n: "shared", d: 1, open: 0, badge: "3 files", c: [] } ] },
  { n: "node_modules", d: 1, open: 0, dim: 1, badge: "excluded", c: [] },
  { n: ".gitignore" }, { n: "genea.jsonc" }, { n: "package.json" }, { n: "README.md" },
];

const PACKAGES = [
  { name: "web", path: "apps/web", scripts: [ { s: "dev", on: 1, url: "http://localhost:5173" }, { s: "build" }, { s: "test" }, { s: "lint" } ] },
  { name: "api", path: "apps/api", scripts: [ { s: "dev", on: 1, url: "http://localhost:3000" }, { s: "build" }, { s: "test" } ] },
  { name: "shared", path: "packages/shared", scripts: [ { s: "build" }, { s: "test" } ] },
];

const PROBLEMS = [
  { sev: "e", file: "apps/api/src/routes/users.ts", at: "14:21", msg: "Cannot find name 'UserRow'.", src: "ts(2304)" },
  { sev: "w", file: "apps/web/src/components/UserList.tsx", at: "15:25", msg: "'index' is declared but its value is never read.", src: "lint" },
];

const CHANGES = [
  { st: "M", file: "apps/api/src/routes/users.ts", plus: 5, minus: 1 },
  { st: "A", file: "apps/api/src/db.ts", plus: 18, minus: 0 },
  { st: "M", file: "apps/web/src/components/UserList.tsx", plus: 2, minus: 2 },
];

// ---------- shared helpers (content only; each variant owns its layout) ----------
const esc = s => s.replace(/[&<>]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch]));
const KW = /^(import|from|export|async|function|await|const|let|return|type|new|if|else|undefined|null|true|false)$/;
function hl(line) {
  const re = /(\/\/.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|\b([A-Za-z_][A-Za-z0-9_]*)\b(\s*\()?|\b(\d+)\b/g;
  let out = "", last = 0, m;
  while ((m = re.exec(line))) {
    out += esc(line.slice(last, m.index));
    if (m[1]) out += `<span class="c">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="s">${esc(m[2])}</span>`;
    else if (m[3]) {
      const w = m[3];
      const cls = KW.test(w) ? "k" : m[4] ? "f" : /^[A-Z]/.test(w) ? "t" : "";
      out += (cls ? `<span class="${cls}">${w}</span>` : w) + (m[4] ? esc(m[4]) : "");
    } else if (m[5]) out += `<span class="n">${m[5]}</span>`;
    last = re.lastIndex;
  }
  return out + esc(line.slice(last));
}
function editor(path, { diff = false, hover = false } = {}) {
  const f = FILES[path];
  const lines = f.text.split("\n");
  let html = "";
  lines.forEach((l, i) => {
    const n = i + 1;
    if (diff && f.deleted[n]) html += `<div class="ln dell"><span class="num"></span><span class="g D"></span><span class="code">${hl(f.deleted[n])}</span></div>`;
    let code = hl(l);
    if (f.diag && f.diag.line === n) code = code.replace(new RegExp(`(<span class="t">)?${f.diag.word}(</span>)?`), m => `<span class="squig-${f.diag.sev}">${m}</span>`);
    if (n === f.cursor) code += '<span class="caret"></span>';
    const g = f.git[n] || "";
    const cls = ["ln", n === f.cursor ? "cur" : "", diff && g === "A" ? "addl" : ""].join(" ");
    html += `<div class="${cls}"><span class="num">${n}</span><span class="g ${g}"></span><span class="code">${code}</span></div>`;
  });
  const hov = hover && f.diag ? `<div class="hoverbox" style="left:${f.diag.sev === "e" ? 230 : 260}px;top:${f.diag.line * 19 + 14}px">
      <div><span class="sev-${f.diag.sev}">${f.diag.sev === "e" ? "⊗" : "⚠"}</span> ${esc(PROBLEMS.find(p => p.file === path).msg)} <span class="muted">${PROBLEMS.find(p => p.file === path).src}</span></div>
      <div style="margin-top:6px" class="row"><button class="btn">Quick fix ⌥↩</button><span class="muted">Declare type 'UserRow'</span></div></div>` : "";
  return `<div class="editor mono grow" style="position:relative">${html}${hov}</div>`;
}
function tree(nodes = TREE, depth = 0, active = "apps/api/src/routes/users.ts") {
  return nodes.map(nd => {
    const pad = 8 + depth * 14;
    const ico = nd.d ? (nd.open ? "▾" : "▸") : "";
    const icon = nd.d ? "📁" : /\.tsx?$/.test(nd.n) ? "TS" : /\.json/.test(nd.n) ? "{}" : "·";
    const row = `<div class="tn ${nd.p === active ? "active" : ""} ${nd.st ? "st-" + nd.st : ""}" style="padding-left:${pad}px;${nd.dim ? "opacity:.55" : ""}">
      <span class="chev">${ico}</span><span class="ico" style="${icon === "TS" ? "color:var(--accent);font-size:8.5px;font-weight:700" : ""}">${icon}</span>
      <span class="nm">${nd.n}</span>${nd.badge ? `<span class="badge">${nd.badge}</span>` : ""}</div>`;
    return row + (nd.d && nd.open && nd.c ? tree(nd.c, depth + 1, active) : "");
  }).join("");
}
function terminal(kind = "zsh") {
  const T = {
    zsh: `<span class="p">genea-demo</span> <span class="w">main</span> $ git status --short
 M apps/api/src/routes/users.ts
 A apps/api/src/db.ts
 M apps/web/src/components/UserList.tsx
<span class="p">genea-demo</span> <span class="w">main</span> $ <span class="caret"></span>`,
    run: `<span class="a">[web]</span> dev  ▸ ready in 312 ms  →  <span class="link">http://localhost:5173</span>
<span class="a">[api]</span> dev  ▸ listening on <span class="link">http://localhost:3000</span>
<span class="a">[api]</span> GET /api/users 200 4ms
<span class="a">[web]</span> hmr update /src/components/UserList.tsx
<span class="a">[api]</span> GET /api/users 200 3ms`,
    web: `<span class="a">[web]</span> dev  ▸ ready in 312 ms
  ➜  Local:   <span class="link">http://localhost:5173</span>
<span class="a">[web]</span> hmr update /src/components/UserList.tsx`,
    api: `<span class="a">[api]</span> dev  ▸ watching apps/api/src
<span class="a">[api]</span> listening on <span class="link">http://localhost:3000</span>
<span class="a">[api]</span> GET /api/users 200 4ms
<span class="a">[api]</span> GET /api/users 200 3ms`,
    agent: `<span class="a">agent</span> ▸ Add pagination to listUsers and a getUser route

  Edited apps/api/src/routes/users.ts   <span class="p">+5</span> <span style="color:var(--del)">-1</span>
  Created apps/api/src/db.ts            <span class="p">+18</span>
  Edited apps/web/src/components/UserList.tsx  <span class="p">+2</span> <span style="color:var(--del)">-2</span>

  Ran typecheck: 1 error
    apps/api/src/routes/users.ts:14:21  Cannot find name 'UserRow'.

<span class="a">agent</span> ▸ I'll declare UserRow in db.ts next. Continue? (y/n) <span class="caret"></span>`,
  };
  return `<div class="term mono grow">${T[kind]}</div>`;
}
function problems() {
  return `<div class="list grow scroll" style="padding:4px 0">${PROBLEMS.map(p => `<div class="it"><span class="sev-${p.sev}">${p.sev === "e" ? "⊗" : "⚠"}</span>
    <span>${esc(p.msg)}</span><span class="muted">${p.src}</span><span class="muted" style="margin-left:auto">${p.file.split("/").pop()} ${p.at}</span></div>`).join("")}</div>`;
}
function changes(withActions = false) {
  return `<div class="list" style="padding:4px 0">${CHANGES.map(c => `<div class="it"><span style="color:var(--${c.st === "A" ? "add" : "mod"});width:12px">${c.st}</span>
    <span>${c.file.split("/").pop()}</span><span class="muted" style="font-size:11px">${c.file.split("/").slice(0, -1).join("/")}</span>
    <span style="margin-left:auto;color:var(--add)">+${c.plus}</span><span style="color:var(--del)">−${c.minus}</span>
    ${withActions ? '<button class="btn" style="margin-left:4px">Keep</button><button class="btn">Revert</button>' : ""}</div>`).join("")}</div>`;
}
function status(extra = "") {
  return `<div class="statusbar">
    <span>⎇ main ↑2</span><span class="err">⊗ 1</span><span class="warn">⚠ 1</span>
    ${extra}
    <span style="margin-left:auto"><span class="dot on"></span> web :5173</span><span><span class="dot on"></span> api :3000</span>
    <span>TS 7.0 ✓</span><span>14:21</span><span>LF</span><span>UTF-8</span><span>2 spaces</span></div>`;
}

// ---------- overlays (shared) ----------
let overlay = null;
function renderOverlay() {
  const el = document.getElementById("overlay");
  if (!overlay) return (el.innerHTML = "");
  const scrim = `<div class="scrim" data-a="close"></div>`;
  if (overlay === "palette") el.innerHTML = scrim + `<div class="modal">
    <div class="btabs" style="background:var(--panel)">${["All","Files","Symbols","Actions","Text"].map((t,i)=>`<button class="${i===0?"on":""}">${t}</button>`).join("")}<span class="grow"></span><span class="muted" style="font-size:11px">Search Everywhere ⇧⇧</span></div>
    <input autofocus placeholder="Type to search files, symbols, actions…" value="user">
    <div class="list" style="padding:4px 0 8px">
      <div class="muted" style="padding:4px 12px;font-size:11px">Files</div>
      <div class="it sel"><span style="color:var(--accent);font-size:9px;font-weight:700">TS</span> users.ts <span class="muted">apps/api/src/routes</span></div>
      <div class="it"><span style="color:var(--accent);font-size:9px;font-weight:700">TSX</span> UserList.tsx <span class="muted">apps/web/src/components</span></div>
      <div class="it"><span style="color:var(--accent);font-size:9px;font-weight:700">TS</span> user.ts <span class="muted">packages/shared/src</span></div>
      <div class="muted" style="padding:4px 12px;font-size:11px">Symbols</div>
      <div class="it"><span class="f">ƒ</span> getUser <span class="muted">users.ts</span></div><div class="it"><span class="t">T</span> User <span class="muted">shared/src/user.ts</span></div>
      <div class="muted" style="padding:4px 12px;font-size:11px">Actions</div>
      <div class="it">▶ Run script: dev (all)<span class="kbd" style="margin-left:auto">⌃R</span></div><div class="it">◐ Toggle theme</div>
    </div></div>`;
  else if (overlay === "recent") el.innerHTML = scrim + `<div class="modal" style="display:flex;width:min(560px,92vw)">
    <div class="list br" style="width:170px;padding:6px 0;flex:none"><div class="muted" style="padding:2px 10px;font-size:11px">Tool windows</div>${["Project ⌘1","Terminal ⌥F12","Problems ⌘6","Git ⌘9","Run ⌘4","Find ⌘⇧F"].map(t=>`<div class="it">${t}</div>`).join("")}</div>
    <div class="list grow" style="padding:6px 0"><div class="muted" style="padding:2px 10px;font-size:11px">Recent Files ⌘E</div>${["users.ts","db.ts","UserList.tsx","genea.jsonc","App.tsx","user.ts"].map((t,i)=>`<div class="it ${i===1?"sel":""}">${t}</div>`).join("")}</div></div>`;
  else if (overlay === "tree") el.innerHTML = scrim + `<div class="drawer-l panel col"><div class="panel-h">Project <span class="kbd">⌘1</span><span class="grow"></span><button data-a="close">✕</button></div><div class="tree scroll grow">${tree()}</div></div>`;
  else if (overlay === "term") el.innerHTML = scrim + `<div class="drawer-b panel"><div class="btabs"><button class="on">zsh</button><button><span class="dot on"></span> web · dev</button><button><span class="dot on"></span> api · dev</button><span class="grow"></span><button data-a="close">✕</button></div>${terminal("zsh")}</div>`;
}

// ---------- switcher ----------
let vi = Math.max(0, VARIANTS.findIndex(v => v.key === (new URLSearchParams(location.search).get("variant") || "A").toUpperCase()));
function setTheme(t) { document.documentElement.dataset.theme = t; }
setTheme(matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
function render() {
  const v = VARIANTS[vi];
  document.getElementById("app").innerHTML = v.render();
  renderOverlay();
  document.getElementById("switcher").innerHTML = `<button data-a="prev" title="Previous (←)">‹</button>
    <span class="lbl"><b>${v.key}</b> · ${v.name}</span><button data-a="next" title="Next (→)">›</button>
    <span class="sep"></span><button data-a="theme" title="Toggle theme (T)">◐</button>`;
  const url = new URL(location.href); url.searchParams.set("variant", v.key); history.replaceState(null, "", url);
}
function go(d) { vi = (vi + d + VARIANTS.length) % VARIANTS.length; overlay = null; render(); }
document.addEventListener("click", e => {
  const t = e.target.closest("[data-a]"); if (!t) return;
  const a = t.dataset.a, v = t.dataset.v;
  if (a === "prev") go(-1); else if (a === "next") go(1);
  else if (a === "theme") setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  else if (a === "overlay") { overlay = v; renderOverlay(); }
  else if (a === "close") { overlay = null; renderOverlay(); }
  else if (a === "bottom") { S.bottom = v; render(); }
  else if (a === "sideA") { S.sideA = v; render(); }
  else if (a === "splitC") { S.splitC = !S.splitC; render(); }
  else if (a === "pkgC") { S.pkgC = v; render(); }
  else if (a === "termD") { S.termD = v; render(); }
});
let lastShift = 0;
document.addEventListener("keydown", e => {
  const typing = e.target.closest("input, textarea, [contenteditable]");
  if (e.key === "Escape") { overlay = null; renderOverlay(); return; }
  if (typing) return;
  if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "ArrowRight") go(1);
  else if (e.key.toLowerCase() === "t" && !e.metaKey) setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  else if (e.key === "e" && e.metaKey) { e.preventDefault(); overlay = "recent"; renderOverlay(); }
  else if (e.key === "1" && e.metaKey) { e.preventDefault(); overlay = overlay === "tree" ? null : "tree"; renderOverlay(); }
  else if (e.key === "F12" && e.altKey) { e.preventDefault(); overlay = overlay === "term" ? null : "term"; renderOverlay(); }
  else if (e.key === "Shift" && !e.repeat) { const now = Date.now(); if (now - lastShift < 350) { overlay = "palette"; renderOverlay(); } lastShift = now; }
});
render();
</script>
