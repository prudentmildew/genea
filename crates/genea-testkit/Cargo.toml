[package]
name = "genea-testkit"
description = "Test support for core API tests: the test host and temp-dir fixture projects."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The fake LSP server as a binary, for the benchmark harness (ticket #42). Not
# under src/bin/, which a common global gitignore rule (`bin/`) hides.
[[bin]]
name = "genea-fake-lsp"
path = "src/fake_lsp_main.rs"

[dependencies]
genea-host.workspace = true
tempfile.workspace = true
# Fake tool archives for the download fixture server (src/tools.rs).
base64.workspace = true
flate2.workspace = true
lzma-rust2.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
zip.workspace = true
