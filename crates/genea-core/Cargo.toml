[package]
name = "genea-core"
description = "Genea's framework-free core. Its single entry point is the Workbench."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# No Slint (or any GUI crate) here, ever: tests/no_gui_dependency.rs enforces it.
[dependencies]
genea-host.workspace = true
genea-toolchain.workspace = true
ropey.workspace = true
unicode-width.workspace = true
jsonc-parser.workspace = true
ignore.workspace = true
grep-searcher.workspace = true
grep-regex.workspace = true
grep-matcher.workspace = true
notify.workspace = true
tree-sitter.workspace = true
streaming-iterator.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-json.workspace = true
tree-sitter-css.workspace = true
tree-sitter-html.workspace = true
tree-sitter-md.workspace = true
tree-sitter-yaml.workspace = true
# Templates: `git init` (ticket #60). The branch and the files at HEAD (#56).
gix = { workspace = true, features = ["sha1"] }
# The git gutter (ticket #56): line diffs against HEAD.
imara-diff.workspace = true
# Templates write package.json with its keys in the conventional order; the
# update check (ticket #64) reads GitHub's release JSON.
serde_json = { workspace = true, features = ["preserve_order"] }
# The terminal's emulator (ticket #38).
alacritty_terminal.workspace = true

[dev-dependencies]
genea-testkit.workspace = true
# A support folder for the environment's slow lane, which runs on RealHost.
tempfile.workspace = true
