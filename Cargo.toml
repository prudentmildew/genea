# Genea's Cargo workspace. ARCHITECTURE.md describes the crate layout and the
# rules that keep the core framework-free.

[workspace]
resolver = "3"
members = ["crates/*"]
# patches/ holds vendored crates.io sources used by [patch.crates-io]. They are
# not workspace members.
exclude = ["patches"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
# Genea's own crates.
genea-core = { path = "crates/genea-core" }
genea-host = { path = "crates/genea-host" }
genea-testkit = { path = "crates/genea-testkit" }
genea-toolchain = { path = "crates/genea-toolchain" }

# Core building blocks (spec #19, "Building blocks").
ropey = "1.6.1"
unicode-width = "0.2.2"
# The config (#29): JSONC with positions for inline errors, and the
# `.gitignore` syntax of `exclude` (also used to walk the project).
jsonc-parser = { version = "0.34.0", default-features = false }
ignore = "0.4.33"
# The project watcher: FSEvents on macOS (#29; the Files view builds on it).
notify = "8.2.0"
# Syntax (ticket #24). The grammars depend on `tree-sitter-language`, not on a
# `tree-sitter` version. TS and TSX highlighting concatenates the TypeScript
# query with the JavaScript one, which it inherits.
tree-sitter = "0.27.1"
streaming-iterator = "0.1.9"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-css = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-md = "0.5.3"
tree-sitter-yaml = "0.7.2"
# Git, in-process (ADR 0005): pure Rust, so no `git` binary or C toolchain is
# needed. Each crate turns on the features it uses.
gix = { version = "0.89.0", default-features = false }
# Templates write package.json (ticket #60); the release-update check reads
# GitHub's JSON (ticket #64).
serde_json = "1.0.151"

# Host boundary (genea-host's RealHost). The system TLS stack, so no C crypto
# library is built. It must be `native-tls`: in ureq 3.4.2,
# `native-tls-no-default` alone leaves the backend out and every https
# request panics. RealHost still uses the system trust store
# (RootCerts::PlatformVerifier), not the bundled webpki roots.
ureq = { version = "3.4.2", default-features = false, features = ["native-tls", "gzip"] }

# Test support.
tempfile = "3.27.0"

# Toolchain downloads (genea-toolchain, ADR 0005): JSON documents and
# package.json, npm-style version ranges, checksums, and the archive formats
# Node (.tar.xz), Bun (.zip) and pnpm (.tgz) ship in. All pure Rust.
serde = "1.0.229"
nodejs-semver = "7.0.0"
sha2 = "0.11.0"
base64 = "0.23.1"
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1.10"
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std", "xz", "encoder"] }
zip = { version = "9.0.0", default-features = false, features = ["deflate-flate2"] }

# GUI (ADR 0004), used by genea-view only. Exact pin: a bump is deliberate,
# must pass the benchmark harness, and re-applies the i-slint-common patch
# below (patches/README.md).
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-skia"] }
slint-build = "=1.18.1"

[patch.crates-io]
# ADR 0004: Genea's one Slint patch. It turns off the system-font scan and
# registers Menlo and Apple Symbols explicitly. Re-apply it on every Slint pin
# bump with scripts/reapply-slint-patch.sh (patches/README.md).
i-slint-common = { path = "patches/i-slint-common" }

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1
